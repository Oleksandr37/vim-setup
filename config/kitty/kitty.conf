# Shared Kitty baseline. Put private or device-specific overrides in local.conf.
term xterm-kitty
font_family JetBrainsMono Nerd Font Mono
font_size 14.0

background_opacity 1.0
include kanagawa-dragon.conf
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05

scrollback_lines 20000
wheel_scroll_multiplier 3.0
enable_audio_bell no
confirm_os_window_close 0
shell_integration enabled

# macOS-native URL handling, including when tmux or Neovim has grabbed the
# mouse. Holding Cmd also reveals the detected hyperlink target.
open_url_with default
detect_urls yes
show_hyperlink_targets cmd
mouse_map cmd+left press grabbed discard_event
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
map cmd+shift+u open_url_with_hints

# Terminal agent chat composers commonly use Ctrl+J for a literal newline.
map shift+enter send_key ctrl+j

# Familiar macOS search shortcuts. Neovim maps Ctrl+P/Ctrl+G to files/text.
map cmd+p send_key ctrl+p
map cmd+shift+f send_key ctrl+g

# VS Code-style Quick Fix. F13 is an otherwise-unused transport key that passes
# through tmux and is mapped only in Neovim buffers with an attached LSP.
map cmd+. send_key f13

# macOS commonly reserves Ctrl-Space for switching input languages. Keep that
# system shortcut intact and expose Neovim's manual completion through Cmd-I.
map cmd+i send_key ctrl+space

# tmux manages splits; Cmd+Enter opens a fresh OS window when isolation is useful.
map cmd+enter new_os_window_with_cwd

globinclude local.conf
