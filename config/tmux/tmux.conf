# Keep tmux predictable in Kitty and preserve full color/keyboard support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -sg escape-time 0
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "Workon · #W"

# A session should survive accidental terminal closure.
set -g detach-on-destroy off
set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Mouse scrolling, pane selection, and border dragging. Keyboard use remains available.
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Splits inherit the current repository.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Prefix + H/J/K/L resizes a pane repeatedly; mouse border dragging works too.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

# Useful session controls.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind g display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit
bind N command-prompt -p "Repository path:" "run-shell \"workon --view '#S' --client '#{client_name}' --target '#{pane_id}' '%%'\""

# Workon keeps one visible terminal and one visible agent pane. Additional
# sessions are persistent tabs swapped into those fixed slots.
unbind c
bind c run-shell "workon terminal new --target '#{pane_id}' --client '#{client_name}'"
bind t run-shell "workon popup terminal --root '#{@vim_setup_path}' --client '#{client_name}'"
bind T command-prompt -p "Terminal name:" "run-shell \"workon terminal new '%%' --target '#{pane_id}' --client '#{client_name}'\""
bind a run-shell "workon popup agent --root '#{@vim_setup_path}' --client '#{client_name}'"
bind A command-prompt -p "Agent name:" "run-shell \"workon agent new '%%' --target '#{pane_id}' --client '#{client_name}'\""
bind v run-shell "workon popup service --root '#{@vim_setup_path}' --client '#{client_name}'"
unbind '&'
bind '&' confirm-before -p "Remove this repo from this Workon window? (y/n)" "run-shell \"workon repo remove --view '#S' --target '#{pane_id}'\""

# tmux supports clickable ranges in the bottom status bar (but not within
# pane-border titles). Preserve normal repository-tab clicks outside this range.
bind -T root MouseDown1Status if-shell -F "#{==:#{mouse_status_range},newterm}" \
  "run-shell \"workon terminal new --target '#{pane_id}' --client '#{client_name}'\"" \
  "if-shell -F '#{==:#{mouse_status_range},termpick}' 'run-shell \"workon popup terminal --root \\\"#{@vim_setup_path}\\\" --client \\\"#{client_name}\\\"\"' \"if-shell -F '#{==:#{mouse_status_range},workonupdate}' 'display-popup -E -w 72% -h 72% \\\"workon update\\\"' 'switch-client -t ='\""

# Pane roles and logical terminal/agent tabs are visible in the border.
set -g pane-border-status top
set -g pane-border-format " #[fg=#8ba4b0]#{?#{@vim_setup_deck},#{@vim_setup_deck}: #{@vim_setup_name} [#{@vim_setup_position}],#{@vim_setup_role}} #[fg=#625e5a]#{pane_current_path} "
set -g pane-border-style "fg=#393836"
set -g pane-active-border-style "fg=#8ba4b0"

# Compact Kanagawa Dragon status line.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#12120f,fg=#c5c9c5"
set -g status-left-length 70
set -g status-left "#[range=user|newterm,bg=#87a987,fg=#0d0c0c,bold] [+] #[norange]#[range=user|termpick,bg=#282727,fg=#c5c9c5,bold] [T #{@vim_setup_terminal_position}] #[norange]#[bg=#8ba4b0,fg=#0d0c0c,bold] Workon #[default] #{?#{@workon_update_available},#[range=user|workonupdate,bg=#c4b28a,fg=#0d0c0c,bold] [↑ #{@workon_update_available}] #[norange],}"
set -g status-right "#[fg=#625e5a]#(whoami)@#H #[fg=#8ba4b0]%H:%M "
setw -g window-status-format " #[fg=#625e5a]#I:#W "
setw -g window-status-current-format " #[fg=#c5c9c5,bold]#I:#W "

# Private device-specific settings belong here, outside the public repository.
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
